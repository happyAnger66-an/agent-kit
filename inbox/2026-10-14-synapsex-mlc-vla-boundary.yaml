# 公司级仓库边界 contract 候选（未晋升 standards/，待人类批准）
symptom: "DiT/模型侧优化与通用 fused 核职责混写：领域 glue 进 synapsex，或通用核逻辑散落在 mlc-vla；AiInfraKB 卡片里也硬编码了仓库边界"
root_cause: "缺少公司级、可 sync 的架构边界标准；领域知识卡与做事约束未分流（数字/模式进 AiInfraKB，仓职责进 agent-kit）"
fix: |
  公司级标准（拟 standards/architecture/synapsex-mlc-vla-boundary.md，scope=org）：
  1. synapsex：只收通用 fused / 算子核（如 gelu_fp8、layer_norm_fp8、ada_ln_fp8）；禁止 gr00t/dit 模型名、DiT 调度与领域 glue。
  2. mlc-vla：DiT/模型 glue 与图侧接线只留这里；勿把可复用通用核长期只留在 mlc-vla。
  3. 勿把领域优化塞回上游 GR00T；勿把 DiT glue 混进 synapsex。
  4. AiInfraKB 卡片只写可泛化领域结论（quantize 税、fused e4m3-out 等）；仓边界引用本标准，不在 claim 里硬编码。
