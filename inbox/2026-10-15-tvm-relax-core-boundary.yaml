# 与已晋升 synapsex-mlc-vla-boundary 互补：补 tvm-relax「只管核心编译」一侧
symptom: "tvm-relax 仓内仍承载算子实现（如 libfpA_intB_gemm 等），易与「核心编译」职责混淆；agent-kit 已有 synapsex↔mlc-vla 边界，但未写明 tvm-relax 不堆算子、存量算子库须整改迁出"
root_cause: "缺少可 sync 的 tvm-relax 职责标准；既有算子库与 compiler/runtime 框架同仓，边界只靠口头约定"
fix: |
  公司级标准（拟 standards/architecture/tvm-relax-core-boundary.md，scope=org，apply=always）：
  1. tvm-relax：只负责 TVM 核心编译（compiler + runtime 框架）；禁止新增通用/领域算子实现。
